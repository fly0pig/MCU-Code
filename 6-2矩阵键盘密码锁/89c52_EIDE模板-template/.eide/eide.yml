version: "4.1"
name: 89c52_EIDE模板-template
type: C51
deviceName: null
packDir: null
srcDirs:
  - src
virtualFolder:
  name: <virtual_root>
  files:
    - path: src/LCD1602.c
    - path: src/LCD1602.h
    - path: src/Delay.c
    - path: src/Delay.h
  folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: 7319e78d157d98a3caffff35805b2fbb
targets:
  Debug:
    cppPreprocessAttrs:
      defineList: []
      incList:
        - inc
        - d:/Program Files/Keil_v5/C51/INC
      libList: []
    excludeList: []
    settings:
      debugger: unknown
    toolchain: Keil_C51
    toolchainConfigMap:
      GNU_SDCC_MCS51:
        linkerScript: "null"
        options:
          version: 1
          afterBuildTasks: []
          asm-compiler: {}
          beforeBuildTasks: []
          c/cpp-compiler:
            language-c: c99
          global:
            code-size: "8192"
            iram-size: "128"
            mem-model: small
            optimize-type: speed
            xram-size: "0"
          linker:
            output-format: elf
            remove-unused-input-sections: true
      Keil_C51:
        options:
          version: 2
          afterBuildTasks: []
          asm-compiler: {}
          beforeBuildTasks: []
          c/cpp-compiler:
            optimization-level: level-8
            optimization-type: SPEED
          global:
            ram-mode: SMALL
            rom-mode: LARGE
          linker:
            output-format: elf
            remove-unused: true
      SDCC:
        options:
          version: 3
          afterBuildTasks: []
          asm-compiler: {}
          beforeBuildTasks: []
          c/cpp-compiler:
            language-c: c99
          global:
            device: mcs51
            misc-controls: --iram-size 256 --xram-size 0 --code-size 8192
            optimize-type: speed
          linker:
            $mainFileName: main
            output-format: hex
    uploadConfigMap:
      Custom:
        bin: ""
        commandLine: python ./tools/stcflash.py -p COM3 "${hexFile}"
        eraseChipCommand: ""
      stcgal:
        bin: ""
        eepromImgPath: "null"
        extraOptions: -P stc89 -p COM3 -b 19200
        options: .eide/stc.flash.json
    uploader: stcgal
